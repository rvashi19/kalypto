[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A"]

[tool.ruff.lint.per-file-ignores]
"app/scripts/seed_demo.py" = ["E501"]
"app/services/checklist_service.py" = ["E501"]
"app/services/verification_service.py" = ["E501"]
"tests/conftest.py" = ["E402"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
warn_return_any = true
warn_unused_ignores = true
exclude = ["alembic"]
