services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    working_dir: /workspace/apps/api
    command: >
      sh -c "alembic upgrade head &&
      if [ \"$$SEED_DEMO_DATA\" = \"true\" ]; then python -m app.scripts.seed_demo; fi &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      MONGODB_URL: mongodb://mongo:27017
      MONGODB_DATABASE: ${MONGODB_DATABASE:-kalypto}
      COMPLIANCE_STORE_BACKEND: ${COMPLIANCE_STORE_BACKEND:-postgres}
      COMPLIANCE_REFRESH_INTERVAL_DAYS: ${COMPLIANCE_REFRESH_INTERVAL_DAYS:-3}
      FRONTEND_URL: http://localhost:5173
      PYTHONPATH: /workspace/apps/api
      UPLOAD_DIR: /var/data/uploads
      SEED_DEMO_DATA: "true"
    volumes:
      - .:/workspace
      - upload_data:/var/data/uploads
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      mongo:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    working_dir: /workspace
    command: >
      sh -c "corepack enable &&
      pnpm install --no-frozen-lockfile &&
      pnpm --filter web dev --host 0.0.0.0 --port 5173"
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    volumes:
      - .:/workspace
    ports:
      - "5173:5173"
    depends_on:
      api:
        condition: service_started

  compliance-refresh:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    profiles:
      - jobs
    working_dir: /workspace/apps/api
    command: python -m app.scripts.refresh_compliance_sources
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      MONGODB_URL: mongodb://mongo:27017
      MONGODB_DATABASE: ${MONGODB_DATABASE:-kalypto}
      COMPLIANCE_STORE_BACKEND: ${COMPLIANCE_STORE_BACKEND:-postgres}
      COMPLIANCE_REFRESH_INTERVAL_DAYS: ${COMPLIANCE_REFRESH_INTERVAL_DAYS:-3}
      COMPLIANCE_SCRAPER_PROVIDER: ${COMPLIANCE_SCRAPER_PROVIDER:-http}
      COMPLIANCE_ALLOW_PRIVATE_SCRAPE: ${COMPLIANCE_ALLOW_PRIVATE_SCRAPE:-false}
      PYTHONPATH: /workspace/apps/api
    volumes:
      - .:/workspace
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy

volumes:
  postgres_data:
  mongo_data:
  upload_data:
