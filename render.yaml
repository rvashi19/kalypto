previews:
  generation: off

services:
  - type: web
    name: kalypto-api
    runtime: docker
    repo: https://github.com/rvashi19/kalypto.git
    branch: main
    plan: free
    region: oregon
    dockerfilePath: ./apps/api/Dockerfile
    dockerCommand: /bin/sh -c "alembic upgrade head && python -m app.scripts.seed_demo && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: kalypto-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: kalypto-redis
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: FRONTEND_URL
        sync: false
      - key: PYTHONPATH
        value: /workspace/apps/api
    buildFilter:
      paths:
        - apps/api/**
        - render.yaml

  - type: web
    name: kalypto-web
    runtime: static
    repo: https://github.com/rvashi19/kalypto.git
    branch: main
    region: oregon
    buildCommand: corepack enable && corepack prepare pnpm@9.12.1 --activate && pnpm install --no-frozen-lockfile && pnpm --filter web build
    staticPublishPath: ./apps/web/dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
    buildFilter:
      paths:
        - apps/web/**
        - packages/shared/**
        - packages/ui/**
        - package.json
        - pnpm-workspace.yaml
        - tsconfig.base.json
        - components.json
        - render.yaml
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: keyvalue
    name: kalypto-redis
    plan: free
    region: oregon
    maxmemoryPolicy: noeviction
    ipAllowList: []

databases:
  - name: kalypto-postgres
    databaseName: kalypto
    user: kalypto
    plan: free
    region: oregon
