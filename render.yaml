previews:
  generation: "off"

services:
  - type: web
    name: kalypto-api
    runtime: docker
    repo: https://github.com/rvashi19/kalypto.git
    branch: chore/free-tier-deployment
    plan: free
    region: oregon
    dockerfilePath: ./apps/api/Dockerfile
    dockerCommand: /bin/sh ./scripts/start-render.sh
    healthCheckPath: /api/v1/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ALLOW_ORIGIN_REGEX
        value: https://.*\.vercel\.app
      - key: OPENAI_API_KEY
        sync: false
      - key: XAI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: XAI_MODEL
        value: grok-4.3
      - key: XAI_BASE_URL
        value: https://api.x.ai/v1
      - key: COMPLIANCE_STORE_BACKEND
        value: postgres
      - key: COMPLIANCE_REFRESH_INTERVAL_DAYS
        value: 3
      - key: COMPLIANCE_SCRAPER_PROVIDER
        value: http  # set to "scrapling" after building with --build-arg INSTALL_SCRAPLING=true
      - key: COMPLIANCE_SCRAPLING_RENDER_JS
        value: "false"  # "true" needs a browser (INSTALL_SCRAPLING_BROWSERS=true); not for free tier
      - key: COMPLIANCE_ALLOW_PRIVATE_SCRAPE
        value: "false"
      # Country Compliance Checker v1 (official-source retrieval + AI extraction)
      - key: AI_PROVIDER
        value: auto
      - key: COMPLIANCE_ALLOWED_DOMAINS
        sync: false
      - key: COMPLIANCE_MAX_PAGES_PER_JOB
        value: "10"
      - key: COMPLIANCE_MAX_PDF_MB
        value: "15"
      - key: COMPLIANCE_STORAGE_BACKEND
        value: local
      - key: COMPLIANCE_STORAGE_PATH
        value: /tmp/kalypto_compliance_storage
      - key: UPLOAD_DIR
        value: /tmp/kalypto_uploads
      - key: R2_BUCKET_NAME
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: SEED_DEMO_DATA
        value: "false"
      - key: PYTHONPATH
        value: /workspace/apps/api
    buildFilter:
      paths:
        - apps/api/**
        - render.yaml
